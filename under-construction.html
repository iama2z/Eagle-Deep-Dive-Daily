  <script>try { if (localStorage.getItem('edd_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) { /* storage unavailable */ }</script>

    html.dark img { filter: invert(1) hue-rotate(180deg); }

    h1 { margin: 1rem 0 0.5rem; font-size: 1.6rem; }
    p { margin: 0 0 1.5rem; color: #52525b; line-height: 1.5; }
    a { display: inline-block; padding: 0.7rem 1.4rem; border-radius: 9999px; background: #09090B; color: #fff; font-weight: 700; font-size: 0.85rem; text-decoration: none; }
